<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>メーカーキャンペーン情報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:  #1A5FA8;
      --primary2: #134880;
      --yellow:   #F5C842;
      --bg:       #F2F6FB;
      --white:    #FFFFFF;
      --dark:     #111827;
      --gray:     #6B7280;
      --border:   #D9E4F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100dvh;
    }

    /* ヘッダー */
    header {
      background: var(--primary);
      padding: 14px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    header .label {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.65);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 21px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.03em;
      line-height: 1;
    }
    header h1 span { color: var(--yellow); }
    .total-count {
      font-size: 11px;
      color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.2);
      border-radius: 20px;
      padding: 3px 10px;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    /* 検索バー */
    .search-wrap {
      padding: 10px 14px 0;
      background: var(--primary);
    }
    .search-wrap input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.18);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .search-wrap input::placeholder { color: rgba(255,255,255,0.55); }

    /* フィルターバー */
    .filter-bar {
      display: flex;
      gap: 6px;
      padding: 10px 14px 12px;
      overflow-x: auto;
      background: var(--primary);
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      flex-shrink: 0;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.85);
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn.active {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--dark);
      font-weight: 700;
    }

    /* 結果バー */
    .result-bar {
      padding: 10px 16px 4px;
      font-size: 11px;
      color: var(--gray);
    }

    /* リスト */
    .campaign-list {
      padding: 4px 12px 80px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* カード */
    .campaign-card {
      background: var(--white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
      animation: fadeUp 0.2s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* カードヘッダー */
    .card-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px 9px;
      border-bottom: 1px solid var(--border);
    }
    .card-head .cat-badge {
      font-size: 10px;
      font-weight: 700;
      border-radius: 6px;
      padding: 3px 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .card-head .maker {
      font-size: 11px;
      color: var(--gray);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-head .period {
      font-size: 10px;
      color: var(--gray);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .period.active-now {
      color: #059669;
      font-weight: 700;
    }
    .period.ending-soon {
      color: #D97706;
      font-weight: 700;
    }
    .period.expired {
      color: #9CA3AF;
    }

    /* カードボディ */
    .card-body {
      padding: 10px 14px 12px;
    }
    .campaign-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    /* 商品リスト */
    .product-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-top: 1px dashed var(--border);
    }
    .product-item:first-child { border-top: none; }
    .product-name {
      flex: 1;
      font-size: 12px;
      line-height: 1.4;
      min-width: 0;
    }
    .product-spec {
      font-size: 10px;
      color: var(--gray);
      margin-top: 1px;
    }
    .product-deal {
      font-size: 13px;
      font-weight: 900;
      color: #D93B2B;
      white-space: nowrap;
      flex-shrink: 0;
      background: #FDE8E6;
      border-radius: 6px;
      padding: 3px 8px;
    }

    /* 備考 */
    .card-note {
      margin-top: 8px;
      font-size: 11px;
      color: #92400E;
      background: #FFFBEB;
      border-left: 3px solid #F5C842;
      padding: 5px 9px;
      border-radius: 0 6px 6px 0;
      line-height: 1.5;
    }

    /* パンフレットボタン */
    .card-footer {
      padding: 0 14px 12px;
    }
    .pamphlet-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .pamphlet-btn:active { background: var(--border); }

    /* 空・ローディング */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
      font-size: 14px;
    }
    .empty .emoji { font-size: 40px; margin-bottom: 10px; }
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 999;
    }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 13px; color: var(--gray); }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>キャンペーン情報を読み込んでいます…</p>
</div>

<header>
  <div class="header-row">
    <div>
      <div class="label">GAMOU YOKOHAMA</div>
      <h1>🎁 メーカー<span>キャンペーン</span></h1>
    </div>
    <div class="total-count" id="total-count">-- 件</div>
  </div>
</header>

<div class="search-wrap">
  <input type="search" id="search-input" placeholder="メーカー名・商品名・カテゴリーで検索…">
</div>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-cat="all">すべて</button>
</div>

<div class="result-bar" id="result-bar"></div>
<div class="campaign-list" id="campaign-list"></div>

<script>
// ============================================================
// GAS URL（キャンペーンスプレッドシート用）
// ============================================================
const GAS_URL = 'YOUR_CAMPAIGN_GAS_URL_HERE';

// カテゴリーカラー
const CAT_COLOR = {
  'ブリーチ':   ['#7B3FA0','#F0E6F9'],
  'スキンケア': ['#C0306A','#FDE6EF'],
  'カラー':     ['#1A5FA8','#E6EEFE'],
  'パーマ':     ['#2A7A4B','#DCF3E8'],
  'トリートメント': ['#C07A10','#FEF3DC'],
  'スタイリング': ['#1A8A8A','#DCF5F5'],
  'シャンプー': ['#4A4A90','#ECEEF9'],
  'その他':     ['#666666','#F0F0F0'],
};
function getCatColors(cat) {
  return CAT_COLOR[cat] || ['#555','#f0f0f0'];
}

// フォールバックデータ（スプレッドシートの現在データ）
const FALLBACK_DATA = [
  {
    makerCode:'116', maker:'シュワルフコフ', category:'ブリーチ',
    title:'夏のブリーチデザインサポートキャンペーン',
    start:'2026/07/01', end:'2026/08/31',
    products:[
      { name:'ファイバープレックス　パウダーブリーチ', spec:'', deal:'2+1' }
    ],
    note:'', pamphlet:'https://acrobat.adobe.com/id/urn:aaid:sc:AP:08b54421-dac6-4fa8-a6bb-ad27ab2eabac'
  },
  {
    makerCode:'116', maker:'シュワルフコフ', category:'ブリーチ',
    title:'（新規お取り扱いサロン様限定）夏のブリーチデザインサポートキャンペーン',
    start:'2026/06/01', end:'2026/07/30',
    products:[
      { name:'イゴラ　ヴァリオブロンドプラス', spec:'', deal:'1+1' }
    ],
    note:'新たにお取り扱いいただけるサロン様限定企画となります',
    pamphlet:'https://acrobat.adobe.com/id/urn:aaid:sc:AP:e994f5ef-fc60-4b45-9ff0-b308eb3398a3'
  },
  {
    makerCode:'613', maker:'BJC', category:'スキンケア',
    title:'V3ファンデーション5+1キャンペーン',
    start:'2026/06/01', end:'2026/07/30',
    products:[
      { name:'インテリジェントファンデーション', spec:'15g', deal:'5+1' },
      { name:'インテリジェントファンデーション(レフィル/パフ付）', spec:'15gレフィル', deal:'5+1' }
    ],
    note:'', pamphlet:''
  },
];

// 期間ステータス判定
function getPeriodStatus(start, end) {
  const now = new Date();
  const s = new Date(start.replace(/\//g,'-'));
  const e = new Date(end.replace(/\//g,'-'));
  e.setHours(23,59,59);
  if (now > e) return 'expired';
  if (now < s) return 'upcoming';
  const diffDays = Math.ceil((e - now) / 86400000);
  if (diffDays <= 14) return 'ending-soon';
  return 'active-now';
}

function periodLabel(status, start, end) {
  const s = start.replace(/\//g,'/').slice(5); // MM/DD
  const e = end.replace(/\//g,'/').slice(5);
  const startFull = start.slice(2).replace(/\//g,'/'); // YY/MM/DD
  const endFull = end.slice(2).replace(/\//g,'/');
  if (status === 'expired') return `終了 ${startFull}〜${endFull}`;
  if (status === 'upcoming') return `📅 ${startFull}〜`;
  if (status === 'ending-soon') {
    const diffDays = Math.ceil((new Date(end.replace(/\//g,'-')) - new Date()) / 86400000);
    return `⏰ 残り${diffDays}日`;
  }
  return `✅ ${s}〜${e}`;
}

// データを「タイトル単位」にグループ化
function groupCampaigns(data) {
  const map = new Map();
  data.forEach(row => {
    const key = `${row.makerCode}_${row.title}`;
    if (!map.has(key)) {
      map.set(key, {
        makerCode: row.makerCode,
        maker: row.maker,
        category: row.category,
        title: row.title,
        start: row.start,
        end: row.end,
        products: [],
        note: row.note,
        pamphlet: row.pamphlet
      });
    }
    const g = map.get(key);
    row.products.forEach(p => g.products.push(p));
  });
  return [...map.values()];
}

function buildCard(camp, index) {
  const [accent, bg] = getCatColors(camp.category);
  const status = getPeriodStatus(camp.start, camp.end);
  const pLabel = periodLabel(status, camp.start, camp.end);

  const card = document.createElement('div');
  card.className = 'campaign-card';
  card.style.animationDelay = `${Math.min(index * 40, 400)}ms`;
  if (status === 'expired') card.style.opacity = '0.6';

  const productsHTML = camp.products.map(p => `
    <div class="product-item">
      <div class="product-name">
        ${p.name}
        ${p.spec ? `<div class="product-spec">${p.spec}</div>` : ''}
      </div>
      <div class="product-deal">${p.deal}</div>
    </div>
  `).join('');

  const noteHTML = camp.note
    ? `<div class="card-note">⚠️ ${camp.note}</div>` : '';

  const pamphletHTML = camp.pamphlet
    ? `<div class="card-footer">
        <a class="pamphlet-btn" href="${camp.pamphlet}" target="_blank" rel="noopener">
          📄 パンフレットを見る
        </a>
      </div>` : '';

  card.innerHTML = `
    <div class="card-head">
      <span class="cat-badge" style="color:${accent};background:${bg}">${camp.category}</span>
      <span class="maker">${camp.maker}</span>
      <span class="period ${status}">${pLabel}</span>
    </div>
    <div class="card-body">
      <div class="campaign-title">${camp.title}</div>
      ${productsHTML}
      ${noteHTML}
    </div>
    ${pamphletHTML}
  `;
  return card;
}

let allCampaigns = [];
let currentCat = 'all';
let searchQuery = '';

function getFiltered() {
  return allCampaigns.filter(c => {
    const catOk = currentCat === 'all' || c.category === currentCat;
    const q = searchQuery.trim();
    const searchOk = !q ||
      c.maker.includes(q) ||
      c.title.includes(q) ||
      c.category.includes(q) ||
      c.products.some(p => p.name.includes(q));
    return catOk && searchOk;
  });
}

function render() {
  const list = document.getElementById('campaign-list');
  const bar = document.getElementById('result-bar');
  const filtered = getFiltered();
  list.innerHTML = '';

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="emoji">🔍</div>該当するキャンペーンが見つかりませんでした</div>`;
    bar.textContent = '';
    return;
  }

  bar.textContent = `${filtered.length} 件表示中`;
  filtered.forEach((c, i) => list.appendChild(buildCard(c, i)));
}

function buildFilter(campaigns) {
  const cats = [...new Set(campaigns.map(c => c.category))].sort();
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '<button class="filter-btn active" data-cat="all">すべて</button>';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat;
    btn.textContent = cat;
    bar.appendChild(btn);
  });
  bar.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentCat = btn.dataset.cat;
    bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
}

document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

// GASからデータ取得（スプレッドシートが別なので別GAS URL）
async function fetchFromGAS() {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now();
    const s = document.createElement('script');
    s.src = GAS_URL + '?callback=' + cb;
    window[cb] = data => { delete window[cb]; s.remove(); resolve(data); };
    s.onerror = () => reject();
    setTimeout(() => reject(), 8000);
    document.head.appendChild(s);
  });
}

async function init() {
  let rawData = null;

  if (GAS_URL !== 'YOUR_CAMPAIGN_GAS_URL_HERE') {
    try { rawData = await fetchFromGAS(); } catch(e) {}
  }
  if (!rawData) rawData = FALLBACK_DATA;

  allCampaigns = groupCampaigns(rawData);

  // 期間順（終了済みを末尾に）
  allCampaigns.sort((a, b) => {
    const sa = getPeriodStatus(a.start, a.end);
    const sb = getPeriodStatus(b.start, b.end);
    const order = { 'ending-soon':0, 'active-now':1, 'upcoming':2, 'expired':3 };
    return (order[sa]||9) - (order[sb]||9);
  });

  document.getElementById('total-count').textContent = allCampaigns.length + ' 件';
  buildFilter(allCampaigns);
  render();
  document.getElementById('loading').style.display = 'none';
}

init();
</script>
</body>
</html>
