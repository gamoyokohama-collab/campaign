<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>メーカーキャンペーン情報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary:  #1A5FA8;
      --primary2: #134880;
      --yellow:   #F5C842;
      --bg:       #F2F6FB;
      --white:    #FFFFFF;
      --dark:     #111827;
      --gray:     #6B7280;
      --border:   #D9E4F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--dark);
      min-height: 100dvh;
    }

    header {
      background: var(--primary);
      padding: 14px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .header-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    header .label {
      font-family: 'Oswald', sans-serif;
      font-size: 10px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.65);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    header h1 {
      font-family: 'Oswald', sans-serif;
      font-size: 21px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.03em;
      line-height: 1;
    }
    header h1 span { color: var(--yellow); }
    .total-count {
      font-size: 11px;
      color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.2);
      border-radius: 20px;
      padding: 3px 10px;
      margin-bottom: 2px;
      white-space: nowrap;
    }

    .search-wrap {
      padding: 10px 14px 0;
      background: var(--primary);
    }
    .search-wrap input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.18);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .search-wrap input::placeholder { color: rgba(255,255,255,0.55); }

    .filter-bar {
      display: flex;
      gap: 6px;
      padding: 10px 14px 12px;
      overflow-x: auto;
      background: var(--primary);
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      flex-shrink: 0;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.85);
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn.active {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--dark);
      font-weight: 700;
    }

    .result-bar {
      padding: 10px 16px 4px;
      font-size: 11px;
      color: var(--gray);
    }

    .campaign-list {
      padding: 4px 12px 80px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .campaign-card {
      background: var(--white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
      animation: fadeUp 0.2s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px 9px;
      border-bottom: 1px solid var(--border);
    }
    .card-head .cat-badge {
      font-size: 10px;
      font-weight: 700;
      border-radius: 6px;
      padding: 3px 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .card-head .maker {
      font-size: 11px;
      color: var(--gray);
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-head .period {
      font-size: 10px;
      color: var(--gray);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .period.active-now { color: #059669; font-weight: 700; }
    .period.ending-soon { color: #D97706; font-weight: 700; }
    .period.expired { color: #9CA3AF; }

    .card-body { padding: 10px 14px 12px; }
    .campaign-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .product-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-top: 1px dashed var(--border);
    }
    .product-item:first-child { border-top: none; }
    .product-name {
      flex: 1;
      font-size: 12px;
      line-height: 1.4;
      min-width: 0;
    }
    .product-spec {
      font-size: 10px;
      color: var(--gray);
      margin-top: 1px;
    }
    .product-deal {
      font-size: 13px;
      font-weight: 900;
      color: #D93B2B;
      white-space: nowrap;
      flex-shrink: 0;
      background: #FDE8E6;
      border-radius: 6px;
      padding: 3px 8px;
    }

    .card-note {
      margin-top: 8px;
      font-size: 11px;
      color: #92400E;
      background: #FFFBEB;
      border-left: 3px solid #F5C842;
      padding: 5px 9px;
      border-radius: 0 6px 6px 0;
      line-height: 1.5;
    }

    .card-footer { padding: 0 14px 12px; }
    .pamphlet-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .pamphlet-btn:active { background: var(--border); }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--gray);
      font-size: 14px;
      line-height: 1.6;
    }
    .empty .emoji { font-size: 40px; margin-bottom: 10px; }

    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 999;
      transition: opacity 0.2s ease;
    }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 13px; color: var(--gray); }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>キャンペーン情報を読み込んでいます…</p>
</div>

<header>
  <div class="header-row">
    <div>
      <div class="label">GAMO YOKOHAMA</div>
      <h1>🎁 メーカー<span>キャンペーン</span></h1>
    </div>
    <div class="total-count" id="total-count">-- 件</div>
  </div>
</header>

<div class="search-wrap">
  <input type="search" id="search-input" placeholder="メーカー名・商品名・カテゴリーで検索…">
</div>

<div class="filter-bar" id="filter-bar">
  <button class="filter-btn active" data-cat="all">すべて</button>
</div>

<div class="result-bar" id="result-bar"></div>
<div class="campaign-list" id="campaign-list"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyTcoGfyfZvPzEQ5m5PkVp_4sBBXKYA8NvZyUzJR_G8NkEx3YblSBKUSKy5ubU4awZRgA/exec';
const LOCAL_STORAGE_KEY = 'gamo_campaign_cache_v2';

const CAT_COLOR = {
  'ブリーチ':   ['#7B3FA0','#F0E6F9'],
  'スキンケア': ['#C0306A','#FDE6EF'],
  'カラー':     ['#1A5FA8','#E6EEFE'],
  'パーマ':     ['#2A7A4B','#DCF3E8'],
  'トリートメント': ['#C07A10','#FEF3DC'],
  'スタイリング': ['#1A8A8A','#DCF5F5'],
  'シャンプー': ['#4A4A90','#ECEEF9'],
  'その他':     ['#666666','#F0F0F0'],
};

function getCatColors(cat) {
  return CAT_COLOR[cat] || ['#555','#f0f0f0'];
}

function getPeriodStatus(start, end) {
  const now = new Date();
  const s = new Date(start.replace(/\//g,'-'));
  const e = new Date(end.replace(/\//g,'-'));
  e.setHours(23,59,59);
  if (now > e) return 'expired';
  if (now < s) return 'upcoming';
  const diffDays = Math.ceil((e - now) / 86400000);
  if (diffDays <= 14) return 'ending-soon';
  return 'active-now';
}

function periodLabel(status, start, end) {
  const s = start.replace(/\//g,'/').slice(5);
  const e = end.replace(/\//g,'/').slice(5);
  const startFull = start.slice(2).replace(/\//g,'/');
  const endFull = end.slice(2).replace(/\//g,'/');
  if (status === 'expired') return `終了 ${startFull}〜${endFull}`;
  if (status === 'upcoming') return `📅 ${startFull}〜`;
  if (status === 'ending-soon') {
    const diffDays = Math.ceil((new Date(end.replace(/\//g,'-')) - new Date()) / 86400000);
    return `⏰ 残り${diffDays}日`;
  }
  return `✅ ${s}〜${e}`;
}

function groupCampaigns(data) {
  const map = new Map();
  data.forEach(row => {
    const key = `${row.makerCode}_${row.title}_${row.start}_${row.end}`;
    if (!map.has(key)) {
      map.set(key, {
        makerCode: row.makerCode,
        maker: row.maker,
        category: row.category,
        title: row.title,
        start: row.start,
        end: row.end,
        products: [],
        note: row.note,
        pamphlet: row.pamphlet
      });
    }
    const g = map.get(key);
    row.products.forEach(p => g.products.push(p));
  });
  return [...map.values()];
}

function buildCard(camp, index) {
  const [accent, bg] = getCatColors(camp.category);
  const status = getPeriodStatus(camp.start, camp.end);
  const pLabel = periodLabel(status, camp.start, camp.end);

  const card = document.createElement('div');
  card.className = 'campaign-card';
  card.style.animationDelay = `${Math.min(index * 30, 300)}ms`;
  if (status === 'expired') card.style.opacity = '0.6';

  const productsHTML = camp.products.map(p => `
    <div class="product-item">
      <div class="product-name">
        ${p.name}
        ${p.spec ? `<div class="product-spec">${p.spec}</div>` : ''}
      </div>
      <div class="product-deal">${p.deal}</div>
    </div>
  `).join('');

  const noteHTML = camp.note ? `<div class="card-note">⚠️ ${camp.note}</div>` : '';
  const pamphletHTML = camp.pamphlet ? `
    <div class="card-footer">
      <a class="pamphlet-btn" href="${camp.pamphlet}" target="_blank" rel="noopener">📄 パンフレットを見る</a>
    </div>` : '';

  card.innerHTML = `
    <div class="card-head">
      <span class="cat-badge" style="color:${accent};background:${bg}">${camp.category}</span>
      <span class="maker">${camp.maker}</span>
      <span class="period ${status}">${pLabel}</span>
    </div>
    <div class="card-body">
      <div class="campaign-title">${camp.title}</div>
      ${productsHTML}
      ${noteHTML}
    </div>
    ${pamphletHTML}
  `;
  return card;
}

let allCampaigns = [];
let currentCat = 'all';
let searchQuery = '';

function getFiltered() {
  return allCampaigns.filter(c => {
    const catOk = currentCat === 'all' || c.category === currentCat;
    const q = searchQuery.trim();
    const searchOk = !q ||
      c.maker.includes(q) ||
      c.title.includes(q) ||
      c.category.includes(q) ||
      c.products.some(p => p.name.includes(q));
    return catOk && searchOk;
  });
}

function render() {
  const list = document.getElementById('campaign-list');
  const bar = document.getElementById('result-bar');
  const filtered = getFiltered();
  list.innerHTML = '';

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="emoji">🔍</div>該当するキャンペーンが見つかりませんでした</div>`;
    bar.textContent = '';
    return;
  }

  bar.textContent = `${filtered.length} 件表示中`;
  filtered.forEach((c, i) => list.appendChild(buildCard(c, i)));
}

function buildFilter(campaigns) {
  const cats = [...new Set(campaigns.map(c => c.category))].sort();
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = '<button class="filter-btn active" data-cat="all">すべて</button>';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat;
    btn.textContent = cat;
    bar.appendChild(btn);
  });
  bar.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentCat = btn.dataset.cat;
    bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
}

document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

// fetchによる直接取得（リダイレクト追従）
async function fetchCampaignData() {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000); // 最大20秒待つ

  try {
    const response = await fetch(GAS_URL + '?_t=' + Date.now(), {
      method: 'GET',
      redirect: 'follow',
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if (!response.ok) {
      throw new Error(`HTTPエラー: ${response.status}`);
    }
    const data = await response.json();
    if (data && data.error) {
      throw new Error(`GASエラー: ${data.error}`);
    }
    return data;
  } catch (err) {
    clearTimeout(timeoutId);
    throw err;
  }
}

function updateView(rawData) {
  const grouped = groupCampaigns(rawData);
  allCampaigns = grouped.filter(c => getPeriodStatus(c.start, c.end) !== 'expired');

  allCampaigns.sort((a, b) => {
    const codeA = parseInt(a.makerCode) || 0;
    const codeB = parseInt(b.makerCode) || 0;
    if (codeA !== codeB) return codeA - codeB;
    const statusOrder = { 'ending-soon':0, 'active-now':1, 'upcoming':2 };
    return (statusOrder[getPeriodStatus(a.start, a.end)]||9) - (statusOrder[getPeriodStatus(b.start, b.end)]||9);
  });

  document.getElementById('total-count').textContent = allCampaigns.length + ' 件';
  buildFilter(allCampaigns);
  render();

  const loading = document.getElementById('loading');
  if (loading) {
    loading.style.opacity = '0';
    setTimeout(() => { loading.style.display = 'none'; }, 200);
  }
}

async function init() {
  // 1. 保存された前回キャッシュがあれば即座に表示（0秒表示）
  let hasLocalData = false;
  const cachedData = localStorage.getItem(LOCAL_STORAGE_KEY);
  if (cachedData) {
    try {
      const parsed = JSON.parse(cachedData);
      if (Array.isArray(parsed) && parsed.length > 0) {
        updateView(parsed);
        hasLocalData = true;
      }
    } catch (e) {}
  }

  // 2. 最新データを取得
  try {
    const rawData = await fetchCampaignData();
    if (Array.isArray(rawData) && rawData.length > 0) {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(rawData));
      updateView(rawData);
    } else {
      throw new Error('データが空でした');
    }
  } catch (err) {
    console.error('Fetch error:', err);
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';

    // 前回のローカルデータも表示できていない場合のみエラー画面を表示
    if (!hasLocalData) {
      document.getElementById('campaign-list').innerHTML = `
        <div class="empty">
          <div class="emoji">⚠️</div>
          <strong>データの取得に失敗しました</strong><br>
          <span style="font-size:11px; color:#999; margin-top:6px; display:inline-block;">
            詳細: ${err.message}
          </span><br><br>
          <button onclick="location.reload()" style="padding:8px 18px;border-radius:20px;border:1px solid #ccc;background:#fff;font-size:13px;cursor:pointer;">
            再読み込み
          </button>
        </div>`;
    }
  }
}

init();
</script>
</body>
</html>
